# Gateway LiteLLM — "Team"
#
# 4 tiers expuestos como model_name lógicos. El servidor MCP solo conoce estos
# 4 nombres; el roster concreto de proveedores por debajo es intercambiable
# aquí sin tocar el MCP. El pipeline `selftest` es la fuente de verdad sobre
# qué modelos siguen vivos/gratis — esta lista es un punto de partida
# razonable a fecha de despliegue y debe revisarse si algún tier degrada.
#
# IDs verificados en vivo el 2026-08-24 contra el /models de cada proveedor
# (Groq, Cerebras, Gemini y OpenRouter renombran/retiran modelos con
# frecuencia; los nombres "obvios" de hace unos meses ya no existían). Si
# algún tier empieza a devolver 404, repetir esa consulta antes de adivinar
# un nombre nuevo — ver README "Verificación end-to-end".
#
# tier-premium aquí = SOLO el fallback API (Gemini Pro). `agy` (Antigravity
# CLI) es la vía por defecto del tier premium y se invoca directamente desde
# el MCP (providers/agy.py) por subprocess, fuera de LiteLLM. Cuando agy
# falla, el MCP cae a este model group.

model_list:
  # ---------------- tier-fast: atómico, JSON repair, clasificación ----------------
  - model_name: tier-fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: tier-fast
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY
  # cerebras/gpt-oss-120b quitado el 2026-08-25: confirmado en vivo que la
  # cuenta entera devuelve 402 "Payment required" (probado también con
  # gemma-4-31b, mismo error — no es el modelo, es que el free tier de la
  # cuenta se acabó). selftest lo detectó; se necesitaría una key nueva o
  # facturación para reactivarlo, fuera de lo que se puede hacer aquí.

  # ---------------- tier-coder: generación/refactor de código ----------------
  # 4 familias de modelo distintas (Cohere, Zhipu/GLM, Nvidia, Mistral) en
  # vez de la misma familia repetida con distintas keys: la diversidad real
  # de familia es lo que hace útil la matriz de consenso cruzado.
  - model_name: tier-coder
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_KEY_1
  - model_name: tier-coder
    litellm_params:
      model: openrouter/z-ai/glm-5.2:free
      api_key: os.environ/OPENROUTER_KEY_2
  - model_name: tier-coder
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_KEY_1
  - model_name: tier-coder
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_KEY

  # ---------------- tier-context: ventanas 1M+, logs/docs enormes ----------------
  - model_name: tier-context
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-context
    litellm_params:
      # confirmado con respuesta real el 2026-08-24; gemini-flash-latest a
      # veces da 503 "high demand" (transitorio), esta es la red de respaldo.
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-context
    litellm_params:
      # 1M de contexto real, confirmado en el listado de OpenRouter.
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      # sin OPENROUTER_KEY_CONTEXT propia: una key de OpenRouter no está
      # atada a un tier, así que reutilizamos la de tier-coder.
      api_key: os.environ/OPENROUTER_KEY_1

  # ---------------- tier-premium: SOLO fallback API (agy es la vía primaria) ----------------
  # agy (Antigravity CLI) NO usa API key — corre por subprocess con el login
  # de la cuenta Google Pro del usuario (providers/agy.py). Esta entrada solo
  # se usa cuando agy falla/no responde, vía el gateway. Reutiliza
  # GEMINI_API_KEY (misma cuenta de AI Studio que tier-context) en vez de
  # pedir una key separada.
  #
  # IMPORTANTE (verificado 2026-08-24 con petición directa a la API): esta
  # cuenta/proyecto tiene cuota gratuita = 0 para el modelo gemini-3.1-pro
  # (tanto gemini-pro-latest como gemini-3.1-pro-preview apuntan a la misma
  # cuota agotada-por-diseño: "limit: 0"). No es un tema de uso, es que el
  # proyecto de Google Cloud no tiene habilitado el free tier de Pro — se
  # arregla activando facturación en la cuenta (fuera del alcance de este
  # config), no reintentando ni cambiando de nombre de modelo. Se deja como
  # primer intento por si se activa más adelante; el segundo entry
  # (flash-lite, con cuota real confirmada) es la red de seguridad para que
  # esta ruta de emergencia nunca se quede muerta entre tanto.
  - model_name: tier-premium
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-premium
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

# ---------------- MCP Gateway: tool-use para workers (Fase 7 del plan) ----------------
# Solo usado por team_ask (allow_web_search=True) sobre tier-context. Nada
# que escribe código (team_task/team_feature/team_epic) toca esto — dar
# tool-use en vivo a un worker que genera código sería una vía de escape a
# la jaula de sandbox.py.
#
# Servidor MCP remoto de Tavily (hospedado por ellos, no autohospedado —
# Brave exige tarjeta de crédito incluso para el free tier; Tavily da
# 1000 créditos/mes que se renuevan, sin tarjeta). La key va DENTRO de la
# URL completa como query param (así es como Tavily espera su MCP
# hospedado); por eso TAVILY_MCP_URL guarda la URL entera, no solo la key
# — la sustitución os.environ/VAR de LiteLLM reemplaza el valor completo
# del campo, no fragmentos dentro de una cadena mayor.
mcp_servers:
  tavily:
    url: os.environ/TAVILY_MCP_URL

router_settings:
  routing_strategy: simple-shuffle
  # una key/modelo que falla repetidamente sale del pool temporalmente
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 2
  timeout: 120
  redis_host: redis
  redis_port: 6379

litellm_settings:
  drop_params: true
  set_verbose: false
  # cascada de fallback: si tier-coder se agota, degrada a tier-fast antes de
  # rendirse; tier-context cae a tier-premium (gemini-pro) para no perder la
  # tarea aunque salga más caro/lento.
  fallbacks:
    - tier-coder: ["tier-fast"]
    - tier-context: ["tier-premium"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  ui_username: os.environ/UI_USERNAME
  ui_password: os.environ/UI_PASSWORD
  # permite añadir/editar modelos y virtual keys desde /ui sin reiniciar,
  # persistido en Postgres, tal como se pidió.
  store_model_in_db: true
