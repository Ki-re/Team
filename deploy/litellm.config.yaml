# Gateway LiteLLM — "Team"
#
# 4 tiers expuestos como model_name lógicos. El servidor MCP solo conoce estos
# 4 nombres; el roster concreto de proveedores por debajo es intercambiable
# aquí sin tocar el MCP. El pipeline `selftest` es la fuente de verdad sobre
# qué modelos siguen vivos/gratis — esta lista es un punto de partida
# razonable a fecha de despliegue y debe revisarse si algún tier degrada.
#
# IDs verificados en vivo el 2026-08-24 contra el /models de cada proveedor
# (Groq, Cerebras, Gemini y OpenRouter renombran/retiran modelos con
# frecuencia; los nombres "obvios" de hace unos meses ya no existían). Si
# algún tier empieza a devolver 404, repetir esa consulta antes de adivinar
# un nombre nuevo — ver README "Verificación end-to-end".
#
# Roster de Gemini reescrito el 2026-08-26 a partir del panel REAL de
# cuotas del usuario (ai.dev/rate-limit), no solo del /models público:
# los "Flash Lite" (3.1 y 3.5) tienen RPD=500/RPM=15, los "Flash" a secas
# (3, 3.5, 3.6, 3.7) solo RPD=20/RPM=5 — 25x menos. Por eso los Lite son
# la columna vertebral y los demás solo diversidad/desbordamiento. Gemini
# Pro tiene RPD=0/RPM=0 en esta cuenta (confirmado dos veces, persistente,
# no transitorio) — no vale la pena tenerlo en el pool, cada intento es un
# fallo seguro; ver providers/agy.py para la vía real a capacidad "Pro"
# (la suscripción Google Pro del usuario, fuera de esta key de API).
#
# tier-premium aquí = SOLO el fallback API. `agy` (Antigravity CLI) es la
# vía por defecto del tier premium y se invoca directamente desde el MCP
# (providers/agy.py) por subprocess, fuera de LiteLLM — por eso el
# fallback agy->API no puede vivir en `fallbacks:` de más abajo (esa
# sección solo encadena model groups DENTRO del proxy) y se implementa a
# mano en Python. Desde 2026-08-26, agy también se usa para reparar código
# cuando el bucle de tier-coder se estanca (engine/repair.py) — tiene
# mucha más cuota real (la suscripción del usuario) que el pool gratuito.

model_list:
  # ---------------- tier-fast: atómico, JSON repair, clasificación ----------------
  - model_name: tier-fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: tier-fast
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY
  - model_name: tier-fast
    litellm_params:
      # RPM=30 / RPD=14400 en el panel real del usuario — el mayor margen
      # diario de todo el roster, ideal para tareas atómicas repetidas.
      # TPM=16K es bajo (no sirve para prompts largos, pero tier-fast no
      # los tiene). Cuenta de Gemini, no de Cerebras (ese sí sigue muerto).
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GEMINI_API_KEY
  # cerebras/gpt-oss-120b quitado el 2026-08-25: confirmado en vivo que la
  # cuenta entera devuelve 402 "Payment required" (probado también con
  # gemma-4-31b vía Cerebras, mismo error — no es el modelo, es que el free
  # tier de la cuenta se acabó). selftest lo detectó; se necesitaría una
  # key nueva o facturación para reactivarlo, fuera de lo que se puede
  # hacer aquí.

  # ---------------- tier-coder: generación/refactor de código ----------------
  # Ampliado el 2026-08-27 tras diagnosticar en vivo (ledger real, ~2h de
  # fallos entre 06:18-08:26 UTC) que tier-coder se colgaba el timeout
  # completo (120s, cero output) — no un bug del proxy: `/health/liveliness`
  # seguía sano, la propia llamada real a un backend concreto era la que se
  # quedaba colgada. Con solo 4 entradas, un único modelo caído se lleva de
  # golpe 1/4 (o 1/3, tras el fan-out inicial) de la capacidad de cada
  # llamada. Mitigación: más familias de modelo = menos probabilidad de que
  # el round-robin vuelva a caer justo en el que está degradado ese día.
  # Los 4 originales quedan (diversidad de familia sigue siendo lo que hace
  # útil la matriz de consenso cruzado); se añaden 4 más, verificados en
  # vivo contra la API de OpenRouter directamente (no solo el catálogo)
  # antes de añadirlos aquí — 2 candidatos más (`minimax/minimax-m2.7:free`,
  # `google/gemma-4-26b-a4b-it:free`) dieron 429 "rate-limited upstream" en
  # el momento de probar y se descartaron por eso, no por nombre inválido.
  - model_name: tier-coder
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_KEY_1
  - model_name: tier-coder
    litellm_params:
      model: openrouter/z-ai/glm-5.2:free
      api_key: os.environ/OPENROUTER_KEY_2
  - model_name: tier-coder
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_KEY_1
  - model_name: tier-coder
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_KEY
  - model_name: tier-coder
    litellm_params:
      # modelo de agente de código dedicado de Poolside, confirmado en vivo.
      model: openrouter/poolside/laguna-s-2.1:free
      api_key: os.environ/OPENROUTER_KEY_1
  - model_name: tier-coder
    litellm_params:
      # variante más pequeña/rápida del mismo modelo de Poolside.
      model: openrouter/poolside/laguna-xs-2.1:free
      api_key: os.environ/OPENROUTER_KEY_2
  - model_name: tier-coder
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_KEY_1
  - model_name: tier-coder
    litellm_params:
      # "Free Models Router" propio de OpenRouter — NO un modelo fijo: en
      # cada llamada selecciona al azar entre ~23 modelos gratis de su
      # catálogo, filtrando por las features que pida la request (tool
      # calling, structured outputs, etc.). No promete evitar backends
      # degradados (no hay health-check documentado, confirmado vía su
      # doc), pero al repartir sobre un pool mucho mayor que el nuestro
      # baja la probabilidad de que CUALQUIER llamada individual caiga en
      # el mismo modelo hundido dos veces seguidas. Verificado en vivo: una
      # llamada de prueba resolvió a `dots-studio/dots-3-note-preview:free`,
      # confirmando que sí enruta de verdad y no es un alias fijo.
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_KEY_2

  # ---------------- tier-context: ventanas 1M+, logs/docs enormes ----------------
  # Los dos "Flash Lite" primero (RPD=500 cada uno en el panel real del
  # usuario): son la columna vertebral real. Los "Flash" a secas después,
  # como diversidad/desbordamiento — RPD=20 cada uno, pero cada modelo es
  # un cubo de cuota INDEPENDIENTE, así que sí suman capacidad agregada.
  - model_name: tier-context
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-context
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-context
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-context
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-context
    litellm_params:
      # 1M de contexto real, confirmado en el listado de OpenRouter — y un
      # proveedor totalmente distinto, no comparte cuota con nada de arriba.
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      # sin OPENROUTER_KEY_CONTEXT propia: una key de OpenRouter no está
      # atada a un tier, así que reutilizamos la de tier-coder.
      api_key: os.environ/OPENROUTER_KEY_1

  # ---------------- tier-premium: SOLO fallback API (agy es la vía primaria) ----------------
  # agy (Antigravity CLI) NO usa API key — corre por subprocess con el login
  # de la cuenta Google Pro del usuario (providers/agy.py). Esta entrada solo
  # se usa cuando agy falla/no responde, vía el gateway. Reutiliza
  # GEMINI_API_KEY (misma cuenta de AI Studio que tier-context) en vez de
  # pedir una key separada.
  #
  # Gemini Pro (gemini-pro-latest / gemini-3.1-pro-preview) se probó y se
  # quitó del pool el 2026-08-26: cuota real = 0/0 en el panel del usuario,
  # confirmado persistente (no transitorio, reintentado tras 15s con el
  # mismo error). No hay forma de arreglarlo desde este config — no lo
  # vuelvas a añadir sin comprobar antes que el usuario activó facturación.
  - model_name: tier-premium
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-premium
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-premium
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

# ---------------- MCP Gateway: tool-use para workers (Fase 7 del plan) ----------------
# Solo usado por team_ask (allow_web_search=True) sobre tier-context. Nada
# que escribe código (team_task/team_feature/team_epic) toca esto — dar
# tool-use en vivo a un worker que genera código sería una vía de escape a
# la jaula de sandbox.py.
#
# Servidor MCP remoto de Tavily (hospedado por ellos, no autohospedado —
# Brave exige tarjeta de crédito incluso para el free tier; Tavily da
# 1000 créditos/mes que se renuevan, sin tarjeta). La key va DENTRO de la
# URL completa como query param (así es como Tavily espera su MCP
# hospedado); por eso TAVILY_MCP_URL guarda la URL entera, no solo la key
# — la sustitución os.environ/VAR de LiteLLM reemplaza el valor completo
# del campo, no fragmentos dentro de una cadena mayor.
mcp_servers:
  tavily:
    url: os.environ/TAVILY_MCP_URL

router_settings:
  routing_strategy: simple-shuffle
  # una key/modelo que falla repetidamente sale del pool temporalmente
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 2
  timeout: 120
  redis_host: redis
  redis_port: 6379

litellm_settings:
  drop_params: true
  set_verbose: false
  # cascada de fallback: si tier-coder se agota, degrada a tier-fast antes de
  # rendirse; tier-context cae a tier-premium (Flash Lite de Gemini, no Pro
  # — ver nota arriba) para no perder la tarea aunque salga más lento.
  fallbacks:
    - tier-coder: ["tier-fast"]
    - tier-context: ["tier-premium"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  ui_username: os.environ/UI_USERNAME
  ui_password: os.environ/UI_PASSWORD
  # permite añadir/editar modelos y virtual keys desde /ui sin reiniciar,
  # persistido en Postgres, tal como se pidió.
  store_model_in_db: true
