# LiteLLM gateway config — "Team"
#
# Four tiers exposed as logical model_name entries. The MCP server only
# ever talks to these four names; the actual provider roster underneath
# is swappable here without touching the MCP at all. Treat this file as a
# starting template, not a fixed catalog: free-tier model availability and
# quotas change often across providers (Groq, OpenRouter, Gemini, etc.
# rename or retire models with some regularity). Run `selftest`
# (`team_validate(selftest=True)`, or `python -m team_mcp.cli run
# team_validate --selftest`) after any change, and verify a candidate
# model responds via the provider's own API directly before trusting its
# public catalog listing — a model name that "should" exist can 404.
#
# tier-premium here is the API FALLBACK only. `agy` (a coding-agent CLI
# that authenticates with the operator's own subscription rather than an
# API key) is the default path for the premium tier and is invoked
# directly by the MCP server via subprocess (providers/agy.py), outside
# LiteLLM entirely — that's why the agy -> API fallback can't live in the
# `fallbacks:` block below (that section only chains model groups INSIDE
# the proxy) and is implemented by hand in Python instead. `agy` is also
# used as a last-resort repair step when the tier-coder repair loop gets
# stuck (engine/repair.py) — a paid coding-agent subscription typically
# has far more real headroom than a shared free-tier pool.
#
# If you don't have (or don't want) a coding-agent CLI like this, just
# leave TEAM_AGY_PATH empty in your .env — the MCP falls back to the
# tier-premium API entries below automatically.

model_list:
  # ---------------- tier-fast: atomic tasks, JSON repair, classification ----------------
  - model_name: tier-fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: tier-fast
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY

  # ---------------- tier-coder: code generation / refactoring ----------------
  # Deliberately spans multiple distinct model families (not the same
  # family repeated under different keys) — that real diversity is what
  # makes the cross-validation consensus matrix useful. A pool this small
  # also means a single degraded model takes out a meaningful fraction of
  # every fan-out call; if you see intermittent timeouts, the fix is
  # usually adding more independent model families here rather than
  # retrying the same small pool.
  - model_name: tier-coder
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_KEY_1
  - model_name: tier-coder
    litellm_params:
      model: openrouter/z-ai/glm-5.2:free
      api_key: os.environ/OPENROUTER_KEY_2
  - model_name: tier-coder
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_KEY
  - model_name: tier-coder
    litellm_params:
      # OpenRouter's own "Free Models Router" — not a fixed model: each
      # call is routed at random across its free-tier catalog, filtered
      # for the features the request needs (tool calling, structured
      # outputs, etc). It doesn't promise to route around unhealthy
      # backends specifically, but spreading load over a much larger pool
      # than a hand-picked list lowers the odds that any single call lands
      # on whatever happens to be degraded that day.
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_KEY_2

  # ---------------- tier-context: 1M+ context windows, large logs/repos ----------------
  - model_name: tier-context
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: tier-context
    litellm_params:
      # a genuinely different provider, so it doesn't share a quota bucket
      # with anything above.
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      # no separate context-tier key needed: an OpenRouter key isn't tied
      # to a specific tier, so this reuses the tier-coder one.
      api_key: os.environ/OPENROUTER_KEY_1

  # ---------------- tier-premium: API fallback only (agy is the primary path) ----------------
  # A "Pro"-tier model (e.g. Gemini Pro) will often show 0 free-tier quota
  # on a fresh API key — that's usually an account-level entitlement gap
  # (billing not enabled on that project), not a broken model name. Don't
  # add one here until you've confirmed real quota for it.
  - model_name: tier-premium
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

# ---------------- MCP Gateway: tool-use for workers ----------------
# Used only by team_ask (when Claude passes allow_web_search=True) on
# tier-context. Nothing that writes code (team_task/team_feature/
# team_epic) touches this — giving live tool-use to a worker that
# generates code would be an escape hatch out of sandbox.py's jail.
#
# Point this at any hosted MCP server that provides web search (Tavily's
# hosted server is one option, no self-hosting required). The key
# typically goes inside the full URL as a query param — check your
# provider's docs for the exact URL shape, and store the FULL url in
# TAVILY_MCP_URL, not just the key: LiteLLM's os.environ/VAR substitution
# replaces the entire field value, not a fragment inside a larger string.
mcp_servers:
  tavily:
    url: os.environ/TAVILY_MCP_URL

router_settings:
  routing_strategy: simple-shuffle
  # a key/model that keeps failing gets temporarily pulled from the pool
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 2
  timeout: 120
  redis_host: redis
  redis_port: 6379

litellm_settings:
  drop_params: true
  set_verbose: false
  # fallback cascade: if tier-coder is exhausted, degrade to tier-fast
  # before giving up; tier-context falls back to tier-premium so a task
  # doesn't get lost even if it comes back slower.
  fallbacks:
    - tier-coder: ["tier-fast"]
    - tier-context: ["tier-premium"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  ui_username: os.environ/UI_USERNAME
  ui_password: os.environ/UI_PASSWORD
  # lets you add/edit models and virtual keys from the /ui without
  # restarting anything, persisted in Postgres.
  store_model_in_db: true
