<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team logo: a violet orchestrator hub connected to four colored worker nodes, representing the coding agent delegating to a farm of models">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </radialGradient>

    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#4c1d95" flood-opacity="0.28"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>

  <g stroke-linecap="round" fill="none">
    <path d="M100,100 C118,84 128,68 143.8,56.2" stroke="#c4b5fd" stroke-width="5"/>
    <path d="M100,100 C118,116 130,130 143.8,143.8" stroke="#c4b5fd" stroke-width="5"/>
    <path d="M100,100 C82,116 70,130 56.2,143.8" stroke="#c4b5fd" stroke-width="5"/>
    <path d="M100,100 C82,84 72,68 56.2,56.2" stroke="#c4b5fd" stroke-width="5"/>
  </g>

  <circle cx="143.8" cy="56.2" r="19" fill="url(#blue)" filter="url(#soft)"/>
  <circle cx="143.8" cy="143.8" r="19" fill="url(#cyan)" filter="url(#soft)"/>
  <circle cx="56.2" cy="143.8" r="19" fill="url(#amber)" filter="url(#soft)"/>
  <circle cx="56.2" cy="56.2" r="19" fill="url(#green)" filter="url(#soft)"/>

  <circle cx="100" cy="100" r="34" fill="url(#hub)" filter="url(#soft)"/>
  <circle cx="100" cy="100" r="34" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.55"/>
</svg>
