<svg viewBox="0 0 660 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="team_ask trocea scope_paths con solape, resume cada trozo en tier-context, reduce a una respuesta final, y verifica de forma deterministica que cada cita ruta:linea existe de verdad antes de devolver el manifiesto; lo que no se puede verificar se marca explicitamente.">
  <defs>
    <marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="q2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="660" height="560" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="24" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">team_ask</text>
  <text x="24" y="47" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Preguntas sin escribir nada: map-reduce + citas verificadas.</text>

  <rect x="160" y="70" width="340" height="44" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="330" y="97" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">question + scope_paths</text>

  <line x1="330" y1="114" x2="330" y2="138" stroke="#64748b" stroke-width="1.6" marker-end="url(#q1)"/>

  <rect x="160" y="138" width="340" height="52" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="330" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4c1d95">chunking con solape</text>
  <text x="330" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5b21b6">nunca se pasa contenido entero, solo rutas</text>

  <line x1="330" y1="190" x2="330" y2="214" stroke="#64748b" stroke-width="1.6" marker-end="url(#q1)"/>

  <rect x="160" y="214" width="340" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="330" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">map: resumen por chunk</text>
  <text x="330" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1d4ed8">tier-context, en paralelo</text>

  <!-- web search branch -->
  <rect x="512" y="214" width="124" height="52" rx="9" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="574" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#155e75">allow_web_search</text>
  <text x="574" y="246" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0e7490">Tavily via MCP</text>
  <text x="574" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0e7490">unico tool con tool-use</text>

  <line x1="500" y1="240" x2="508" y2="240" stroke="#0e7490" stroke-width="1.5" marker-end="url(#q2)"/>

  <line x1="330" y1="266" x2="330" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#q1)"/>

  <rect x="160" y="290" width="340" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="330" y="312" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">reduce: respuesta final</text>
  <text x="330" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1d4ed8">sintetiza los resumenes por chunk</text>

  <line x1="330" y1="342" x2="330" y2="366" stroke="#64748b" stroke-width="1.6" marker-end="url(#q1)"/>

  <polygon points="330,366 450,410 330,454 210,410" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="330" y="405" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">¿la cita ruta:linea</text>
  <text x="330" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">existe y dice eso?</text>

  <line x1="450" y1="410" x2="516" y2="410" stroke="#dc2626" stroke-width="1.6" marker-end="url(#q1)"/>
  <text x="483" y="401" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#991b1b">no</text>

  <rect x="440" y="420" width="180" height="52" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="530" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">[no verificado]</text>
  <text x="530" y="458" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#b91c1c">se marca, no se descarta en silencio</text>

  <line x1="330" y1="454" x2="330" y2="478" stroke="#16a34a" stroke-width="1.6" marker-end="url(#q1)"/>
  <text x="355" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#166534">si</text>

  <rect x="160" y="478" width="340" height="56" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="330" y="502" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#14532d">Manifest</text>
  <text x="330" y="519" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#166534">respuesta + citas, cada una verificada o marcada</text>
</svg>
