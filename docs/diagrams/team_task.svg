<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="team_task pide un unico edit a tier-coder, lo verifica en un scratch dir, reintenta una vez con el error literal si falla, y si sigue fallando se declara escalated_from=task en vez de escribir algo peor de lo prometido.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="24" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">team_task</text>
  <text x="24" y="47" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">1 archivo, sin ambiguedad, sin tier premium.</text>

  <rect x="150" y="70" width="340" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="320" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a8a">tier-coder propone un FileEdit en JSON estricto</text>

  <line x1="320" y1="116" x2="320" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>

  <polygon points="320,140 430,183 320,226 210,183" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="320" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">gate en scratch dir</text>
  <text x="320" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#c2410c">¿pasa verify.py?</text>

  <line x1="320" y1="226" x2="320" y2="250" stroke="#16a34a" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <text x="345" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#166534">si</text>

  <rect x="150" y="250" width="340" height="46" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532d">escritura atomica via Sandbox</text>

  <line x1="210" y1="183" x2="70" y2="183" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="140" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">no (intento 1)</text>

  <rect x="20" y="158" width="150" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="95" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">reintento</text>
  <text x="95" y="193" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#b91c1c">con el error literal</text>

  <line x1="95" y1="158" x2="95" y2="116" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="95" y1="116" x2="146" y2="93" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a)"/>

  <line x1="320" y1="226" x2="320" y2="330" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aAmber)"/>
  <text x="380" y="290" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#b45309">no (2/2 intentos)</text>

  <rect x="150" y="330" width="340" height="60" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="320" y="354" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">escalated_from=task</text>
  <text x="320" y="371" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#b45309">se declara en el manifiesto, requiere team_feature</text>

  <text x="24" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Nunca entrega trabajo peor de lo prometido:</text>
  <text x="24" y="435" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">si no puede, lo dice y sugiere la tool correcta.</text>
</svg>
