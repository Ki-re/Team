[project]
name = "team-mcp"
version = "0.1.0"
description = "MCP server: Claude como orquestador, granja de modelos como workers"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "litellm>=1.55.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "anyio>=4.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
team-mcp = "team_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/team_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
