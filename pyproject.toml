[project]
name = "team-mcp"
version = "1.1.0"
description = "MCP server that lets an AI coding agent (Claude, Codex, or anything else that speaks MCP) delegate implementation work to a farm of free/cheap LLMs behind a LiteLLM gateway, with cross-validation consensus, adversarial critique, and bounded repair."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "litellm>=1.55.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "anyio>=4.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Ki-re/Team"
Repository = "https://github.com/Ki-re/Team"
Changelog = "https://github.com/Ki-re/Team/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
team-mcp = "team_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/team_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
